<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#082f33" />
    <title>Cursed Chest — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 20%, #18505a, #061f24 65%); color: #fff4cf; font-family: system-ui, sans-serif; text-align: center; }
      main { max-width: 430px; padding: 32px 24px; border: 1px solid #d6a64b66; border-radius: 24px; background: #09272dcc; box-shadow: 0 24px 70px #0008; }
      img { width: 112px; height: 112px; border-radius: 24px; }
      h1 { margin: 18px 0 8px; color: #ffd36b; }
      p { margin: 0 0 22px; line-height: 1.55; color: #dbe7df; }
      button { border: 0; border-radius: 999px; padding: 13px 22px; background: #e5ad45; color: #241506; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-192.png" alt="Cursed Chest" />
      <h1>Cursed Chest</h1>
      <p>The sea is quiet — you are offline. Reopen the game after your first connected visit, or reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
